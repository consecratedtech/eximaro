  <rect width="512" height="512" rx="120" fill="#17191C"/>
  <g transform="translate(256 256)" fill="#2F7FE0">
    <rect x="-150" y="-38" width="300" height="76" rx="38" transform="rotate(45)"/>
    <rect x="-150" y="-38" width="300" height="76" rx="38" transform="rotate(-45)"/>
  </g>
</svg>
